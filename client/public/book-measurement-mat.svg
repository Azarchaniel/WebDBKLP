<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>WebDBKLP A4 book measurement mat - black and white - print at 100%</title>
  <defs>
    <pattern id="mm" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 H 0 V 1" fill="none" stroke="#000000" stroke-width=".25"/>
    </pattern>
    <pattern id="cm" x="20" y="20" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="url(#mm)"/>
      <path d="M 10 0 H 0 V 10" fill="none" stroke="#000000" stroke-width=".5"/>
      <path d="M 5 0 V 10 M 0 5 H 10" fill="none" stroke="#000000" stroke-width=".35"/>
    </pattern>
    <pattern id="ruler-mm" x="55" width="1" height="4" patternUnits="userSpaceOnUse">
      <path d="M 0 0 V 4" fill="none" stroke="black" stroke-width=".15"/>
    </pattern>
    <pattern id="ruler-half-cm" x="55" width="5" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 0 V 6" fill="none" stroke="black" stroke-width=".25"/>
    </pattern>
    <pattern id="ruler-cm" x="55" width="10" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 0 V 8" fill="none" stroke="black" stroke-width=".35"/>
    </pattern>
  </defs>
  <rect width="210" height="297" fill="white"/>
  <rect x="18" y="18" width="174" height="261" fill="url(#cm)" stroke="#aaaaaa" stroke-width=".2" stroke-dasharray="2 2"/>
  <g font-family="sans-serif" font-size="2.6" text-anchor="middle" fill="black">
    <text x="105" y="8">WebDBKLP - A4 - BLACK AND WHITE - 100% / ACTUAL SIZE</text>
    <text x="105" y="14">Keep all four markers visible. Place book inside dashed border.</text>
    <text x="105" y="282">Verify scale below with a ruler before measuring.</text>
  </g>
  <g>
    <rect x="55" y="287" width="100" height="4" fill="url(#ruler-mm)"/>
    <rect x="55" y="285" width="100" height="6" fill="url(#ruler-half-cm)"/>
    <rect x="55" y="283" width="100" height="8" fill="url(#ruler-cm)"/>
    <path d="M 55 291 H 155 M 155 283 V 291" fill="none" stroke="black" stroke-width=".25"/>
  </g>
  <g font-family="sans-serif" font-size="2.5" text-anchor="middle" fill="black">
    <text x="55" y="295">0</text>
    <text x="65" y="295">1</text>
    <text x="75" y="295">2</text>
    <text x="85" y="295">3</text>
    <text x="95" y="295">4</text>
    <text x="105" y="295">5</text>
    <text x="115" y="295">6</text>
    <text x="125" y="295">7</text>
    <text x="135" y="295">8</text>
    <text x="145" y="295">9</text>
    <text x="155" y="295">10</text>
    <text x="164" y="295" text-anchor="start">cm</text>
  </g>
  <g fill="black">
  <rect x="9" y="9" width="2" height="2"/>
    <path d="M5 5h10v10H5z M7 7v6h6V7z" fill-rule="evenodd"/>
    <path d="M195 5h10v10h-10z M197 7v6h6V7z" fill-rule="evenodd"/>
    <rect x="197" y="7" width="2" height="2"/>
    <rect x="201" y="11" width="2" height="2"/>
    <path d="M195 282h10v10h-10z M197 284v6h6v-6z" fill-rule="evenodd"/>
    <rect x="197" y="284" width="2" height="2"/>
    <rect x="199" y="286" width="2" height="2"/>
    <rect x="201" y="288" width="2" height="2"/>
    <path d="M5 282h10v10H5z M7 284v6h6v-6z" fill-rule="evenodd"/>
    <rect x="7" y="284" width="2" height="2"/>
    <rect x="11" y="284" width="2" height="2"/>
    <rect x="7" y="288" width="2" height="2"/>
    <rect x="11" y="288" width="2" height="2"/>
  </g>
</svg>
